name: Build Release Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE: morphottention
  PKG_DIR: packages/morphottention
  CUDA_MAJOR_MINOR: "13-2"
  TORCH_INDEX: https://download.pytorch.org/whl/cu132

jobs:
  # Source distribution
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: uv sync --package morphottention --no-dev --group build --no-install-workspace

      - name: Build sdist
        run: uv build --package "${PACKAGE}" --sdist --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Linux wheels (x86_64 + aarch64)
  linux-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            cuda_repo: rhel8/x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            cuda_repo: rhel8/sbsa
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --add-repo \
            "https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.cuda_repo }}/cuda-rhel8.repo"
          dnf -y install "cuda-compiler-${CUDA_MAJOR_MINOR}" "cuda-libraries-devel-${CUDA_MAJOR_MINOR}"

      - name: Build wheel
        env:
          CUDA_HOME: /usr/local/cuda-13.2
          MAX_JOBS: "2"
        run: |
          export PATH="/usr/local/cuda-13.2/bin:/opt/python/cp314-cp314/bin:${PATH}"
          python -m pip install --upgrade pip
          # CUDA-enabled torch used only to compile against (no build isolation).
          python -m pip install --index-url "${TORCH_INDEX}" "torch>=2.12"
          python -m pip install scikit-build-core==0.12.2 cmake ninja build auditwheel
          python -m build --wheel --no-isolation "${PKG_DIR}" --outdir dist_raw

      - name: Repair wheel (retag manylinux, do not vendor torch/cuda)
        run: |
          export PATH="/opt/python/cp314-cp314/bin:${PATH}"
          auditwheel repair dist_raw/*.whl --wheel-dir dist \
            --exclude 'libtorch*.so*' \
            --exclude 'libc10*.so*' \
            --exclude 'libcudart.so*' \
            --exclude 'libcublas*.so*' \
            --exclude 'libcuda.so*' \
            --exclude 'libnvToolsExt.so*'

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: dist/*.whl

  # Windows wheel (x86_64)
  windows-wheel:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "13.2.0"
          method: local

      - name: Verify CUDA CRT headers
        shell: cmd
        run: dir "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2\include\crt"

      - name: Build wheel
        env:
          MAX_JOBS: "2"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url "${env:TORCH_INDEX}" "torch>=2.12"
          python -m pip install scikit-build-core==0.12.2 cmake ninja build
          python -m build --wheel --no-isolation "${env:PKG_DIR}" --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist/*.whl

  # Attach every artifact to the GitHub Release
  attach-to-release:
    if: github.event_name == 'release'
    needs: [sdist, linux-wheels, windows-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
