[project]
name = "morphottention-bench"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "morphottention",
    "torch==2.12.0+cu132",
    "numpy==2.4.6",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
morphottention = { workspace = true }
torch = { index = "pytorch" }
